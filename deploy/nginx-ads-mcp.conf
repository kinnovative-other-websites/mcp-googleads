# /etc/nginx/sites-available/ads-mcp.example.com
# Replace ads-mcp.example.com with your hostname, then:
#   sudo ln -s /etc/nginx/sites-available/ads-mcp.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name ads-mcp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx 1.25.1+. On older nginx (Ubuntu 24.04 ships 1.24), delete this line
    # and write "listen 443 ssl http2;" instead. Or let certbot --nginx add HTTPS.
    http2 on;
    server_name ads-mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/ads-mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ads-mcp.example.com/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        # Large Google Ads reports can take a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
